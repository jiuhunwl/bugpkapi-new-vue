name: 功能建议
description: 提出新功能或界面改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认文档仓中没有现成方案：https://github.com/jiuhunwl/bugpkapi-new-docs
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景，而不是直接给实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 影响区域
      multiple: true
      options:
        - 用户端
        - 管理端
        - 主题与布局
        - 国际化
        - 构建与工程化
    validations:
      required: true
