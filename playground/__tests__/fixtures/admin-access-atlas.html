<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdminAccessAtlas browser fixture</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body,
      #app {
        width: 100%;
        min-width: 0;
        margin: 0;
      }

      body {
        padding: 16px;
        background: #020817;
      }

      /* The standalone fixture does not run the application bootstrap that
         normally removes Vben's startup veil. Keep the fixture interactive
         while still exercising the real atlas component. */
      #__app-loading__ {
        display: none !important;
        pointer-events: none !important;
      }

      @media (max-width: 560px) {
        body {
          padding: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

      const summary = {

        uniqueIps: 525,
        windowDays: 30,
      };

      const fixtureState = {
        error: '',
        ready: false,
      };
      window.__adminAccessAtlasFixture = fixtureState;

      try {
        await Promise.all([
          import('@vben/styles/antd'),
          import('/src/styles/responsive.css'),
        ]);
        const [{ createApp, nextTick }, { default: AdminAccessAtlas }] =
          await Promise.all([
            import('vue'),
            import('/src/components/admin-access/AdminAccessAtlas.vue'),
          ]);

        const app = createApp(AdminAccessAtlas, { locations, summary });
        app.config.errorHandler = (error) => {
          fixtureState.error = String(
            error?.stack || error?.message || error,
          );
          console.error(error);
        };
        app.mount('#app');
        await nextTick();
        await new Promise((resolve) => requestAnimationFrame(resolve));
        await new Promise((resolve) => requestAnimationFrame(resolve));
        fixtureState.app = app;
      } catch (error) {
        fixtureState.error = String(error?.stack || error?.message || error);
      } finally {
        fixtureState.ready = true;
      }
    </script>
  </body>
</html>
